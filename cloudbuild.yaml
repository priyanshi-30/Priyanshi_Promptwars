steps:
  # Step 1: Build the container image using the Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/promptwars-app:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/promptwars-app:latest'
      - '.'

  # Step 2: Push the container image to Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/promptwars-app:latest'

  # Step 3: Deploy container image to Google Cloud Run with public access
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'promptwars-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/promptwars-app:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

substitutions:
  _REGION: 'us-central1'

images:
  - 'gcr.io/$PROJECT_ID/promptwars-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
